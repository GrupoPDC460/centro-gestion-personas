<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

      </div>
      <nav class="nav">
        <a class="nav__item" data-route="dashboard"    href="#dashboard"><span class="nav__ico">🏠</span>Dashboard</a>
        <a class="nav__item" data-route="empleados"     href="#empleados"><span class="nav__ico">👥</span>Colaboradores</a>
        <a class="nav__item" data-route="organizacion"  href="#organizacion"><span class="nav__ico">🏢</span>Organización</a>

        <button class="icon-btn" id="themeBtn" aria-label="Cambiar tema">🌙</button>

      <main class="content" id="view"></main>
