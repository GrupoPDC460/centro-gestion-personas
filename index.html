  <!-- Pantalla de inicio de sesión -->
  <div id="login" class="login-overlay">
    <form class="login-card" id="loginForm" autocomplete="on">
      <div class="login-brand"><img class="login-logo" src="assets/brand/pdc-principal.png" alt="Grupo PDC">
        <div><b>Centro de Gestión de Personas</b><span>Grupo PDC</span></div></div>
      <label class="f"><span>Correo</span><input class="input" id="loginEmail" type="email" placeholder="tu@grupopdc.com" autocomplete="username" required></label>
      <label class="f"><span>Contraseña</span><input class="input" id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password" required></label>
      <button class="btn btn--primary" type="submit" id="loginBtn" style="width:100%;justify-content:center">Ingresar</button>
      <div id="loginErr" class="banner banner--err" style="display:none"></div>
      <p class="muted" style="text-align:center">Acceso restringido · datos protegidos en la nube</p>

      <header class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="Menú">☰</button>
        <div class="gsearch">
